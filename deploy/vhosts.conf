# Replace yourdomain.com with your real domain.
<VirtualHost *:80>
    ServerName yourdomain.com
    ServerAlias www.yourdomain.com admin.yourdomain.com api.yourdomain.com
    # ZeroSSL HTTP-file validation must stay reachable before the redirect
    Alias /.well-known/pki-validation /var/www/validation
    <Directory /var/www/validation>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/pki-validation
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName yourdomain.com
    ServerAlias www.yourdomain.com
    DocumentRoot /var/www/isproject1/public
    SSLEngine on
    SSLCertificateFile      /etc/ssl/isproject1/certificate.crt
    SSLCertificateKeyFile   /etc/ssl/isproject1/private.key
    SSLCertificateChainFile /etc/ssl/isproject1/ca_bundle.crt
    <Directory /var/www/isproject1/public>
        Require all granted
        Options -Indexes
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName admin.yourdomain.com
    DocumentRoot /var/www/isproject1/admin
    SSLEngine on
    SSLCertificateFile      /etc/ssl/isproject1/certificate.crt
    SSLCertificateKeyFile   /etc/ssl/isproject1/private.key
    SSLCertificateChainFile /etc/ssl/isproject1/ca_bundle.crt
    <Directory /var/www/isproject1/admin>
        Require all granted
        Options -Indexes
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName api.yourdomain.com
    DocumentRoot /var/www/isproject1/api
    SSLEngine on
    SSLCertificateFile      /etc/ssl/isproject1/certificate.crt
    SSLCertificateKeyFile   /etc/ssl/isproject1/private.key
    SSLCertificateChainFile /etc/ssl/isproject1/ca_bundle.crt
    <Directory /var/www/isproject1/api>
        Require all granted
        Options -Indexes
    </Directory>
</VirtualHost>
