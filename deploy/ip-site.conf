# IP-ONLY MODE (no domain yet). One site, three areas:
#   http://SERVER_IP/        -> student site
#   http://SERVER_IP/admin/  -> admin panel
#   http://SERVER_IP/api/    -> JSON API
<VirtualHost *:80>
    DocumentRoot /var/www/isproject1/public
    <Directory /var/www/isproject1/public>
        Require all granted
        Options -Indexes
    </Directory>

    RedirectMatch ^/(admin|api)$ /$1/

    Alias /admin /var/www/isproject1/admin
    <Directory /var/www/isproject1/admin>
        Require all granted
        Options -Indexes
    </Directory>

    Alias /api /var/www/isproject1/api
    <Directory /var/www/isproject1/api>
        Require all granted
        Options -Indexes
    </Directory>
</VirtualHost>
